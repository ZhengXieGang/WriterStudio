[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "writerstudio"
version = "0.1.0"
description = "ESP32 GRBL 写字机软件：多字体、手写扰动、Markdown/LaTeX、矢量绘图"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "PySide6>=6.6",
    "qtawesome>=1.3",
    "pyqtdarktheme-fork>=2.3",
    "fontTools>=4.40",
    "pyserial>=3.5",
    "matplotlib>=3.7",
    "markdown-it-py>=3.0",
    "svgelements>=1.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pyinstaller>=6.10"]

[project.scripts]
writerstudio = "writerstudio.__main__:main"

[tool.setuptools.packages.find]
include = ["writerstudio*"]

# 内置字库是运行时数据（font_manager 按 __file__ 定位 builtin/ 目录扫描），
# 不声明的话 pip 安装出的包里没有这些文件，CI 等源码树之外的安装全挂
[tool.setuptools.package-data]
"writerstudio.fonts" = ["builtin/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
