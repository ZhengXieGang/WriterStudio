name: ci

# 静态检查、版本一致性与多平台测试门禁。
#
#   * 推送 main 与所有 Pull Request 都会触发；
#   * 静态检查 + 版本核对 + Linux 测试（3.12 主环境 + 3.10 发布基线）是必须通过的门禁；
#   * Windows / macOS 是观察项：跑同一套测试以便尽早发现平台差异，
#     但不阻塞合并——发布产物由 build.yml 在对应平台另行构建并冒烟验证。
#
# 测试在无显示器的 CI 上通过 QT_QPA_PLATFORM=offscreen 运行 Qt。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true        # 同分支新推送取消旧运行，省额度

jobs:
  lint:
    name: 静态检查与版本核对
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 安装 pyflakes
        run: python -m pip install "pyflakes>=3.2"
      - name: 运行 pyflakes
        run: python -m pyflakes writerstudio/ scripts/ tests/ tools/ main.py
      - name: 核对 pyproject.toml 与 __version__ 一致性
        run: python scripts/check_version.py

  test:
    name: 测试（${{ matrix.os }} / Python ${{ matrix.python-version }}）
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            gate: true            # 主门禁平台
          - os: ubuntu-latest
            python-version: "3.10"
            gate: true            # 最低支持版本，与 Linux 发布容器对齐
          - os: windows-latest    # 观察项
            python-version: "3.12"
          - os: macos-latest      # 观察项
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.gate != true }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-test-env
        with:
          python-version: ${{ matrix.python-version }}
      - name: 运行测试
        run: python -m pytest tests/ -q --durations=10
