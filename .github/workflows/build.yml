name: build

# 多平台打包 + 自动发布。PyInstaller 不能交叉编译，三个平台各自原生构建；
# 产物全部自带 Python 解释器与依赖——用户机器零安装直接运行。
#
#   * 手动触发（workflow_dispatch）：只出构建产物，在运行页下载，不发 Release；
#   * 推 v* 标签：门禁测试 → 三平台构建 → 自动创建 GitHub Release
#     （附全部产物 + SHA256SUMS.txt，发布说明只写下载用法，保持极简）。
#
# Linux 产物要在旧发行版上跑：在 ubuntu-latest runner 里用 ubuntu:22.04
# **容器**构建（glibc 2.35 基线）。不直接用 ubuntu-22.04 虚拟机镜像，因为
# 它 2026-09 起退役、2027-04 停支持；容器基线不受 runner 镜像生命周期影响。
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read           # 各构建任务默认只读；写权限只授予 release 任务

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false    # 发布流程不互相取消

jobs:
  test:
    # 发布门禁：标签/手动构建前先全量测试（与 ci.yml 同环境）
    name: 门禁测试
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Qt 运行时系统库 + TeX/poppler（与开发环境对齐，测试用到真实编译链）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            poppler-utils \
            texlive-latex-base texlive-latex-recommended \
            texlive-fonts-recommended texlive-pictures \
            texlive-xetex fonts-noto-cjk
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install . pytest
      - name: Run tests
        run: python -m pytest tests/ -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: WriterStudio-linux64
            container: "ubuntu:22.04"
            py: python3            # 容器自带 3.10（setup-python 的构建要新 glibc）
          - os: windows-latest
            artifact: WriterStudio-win64-portable
            py: python
          - os: macos-latest
            artifact: WriterStudio-macos
            py: python3
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}   # 仅 Linux 条目定义；空值=宿主机
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: 容器基础工具（checkout 需 git；file 供 appimagetool 校验；
              Qt 系统库供 PyInstaller 收集钩子导入 PySide6；python3/pip 供构建）
        if: runner.os == 'Linux'
        run: |
          # 缺 libglib 时 PyInstaller 探测 Qt 路径的子进程会 ImportError，
          # 它只在日志里留一行 WARNING 就跳过**全部** Qt 插件目录——打出来的
          # AppImage 没有 platforms/libqxcb.so，干净系统上直接起不来
          # （appimage.github.io 的收录测试就是这么挂的）。
          # xcb 插件还有一组系统依赖，构建机装齐后 make_appimage 的 ldd 闭包
          # 才能把它们一起收进包里；构建机上没有的库只会被跳过。
          apt-get update
          apt-get install -y --no-install-recommends \
            git file ca-certificates python3 python3-pip binutils \
            libpython3.10 \
            libegl1 libgl1 libglib2.0-0 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libsm6 libice6 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-xkb1 libxcb-xinerama0 \
            libxcb-xinput0 libxcb1 libxcb-util1 libxcb-render0 libxcb-shm0 \
            libxcb-randr0 libxcb-xfixes0 libxcb-sync1
      - uses: actions/setup-python@v5
        if: "!matrix.container"   # 容器：CPython 工具缓存要 GLIBC 2.38，22.04 只有 2.35，改用系统 python3
        with:
          python-version: "3.12"
      - name: Install
        # 容器的 pip 22 构建隔离会装到读不懂 [project] 元数据的老
        # setuptools，项目被装成 UNKNOWN-0.0.0、依赖全丢——先升级
        run: |
          ${{ matrix.py }} -m pip install -U pip setuptools wheel
          ${{ matrix.py }} -m pip install . pyinstaller
      - name: Build
        run: ${{ matrix.py }} -m PyInstaller writerstudio.spec
      - name: AppImage（Linux 零安装格式，随身携带全部系统依赖库）
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"   # CI 容器无 FUSE，解压方式运行
        run: |
          ${{ matrix.py }} - <<'EOF'
          import urllib.request
          urllib.request.urlretrieve(
              "https://github.com/AppImage/appimagetool/releases/download"
              "/continuous/appimagetool-x86_64.AppImage",
              "/tmp/appimagetool")
          EOF
          chmod +x /tmp/appimagetool
          ${{ matrix.py }} scripts/make_appimage.py --appimagetool /tmp/appimagetool
      - name: AppImage 完整性自检（Qt 插件确实进包，且依赖齐全）
        if: runner.os == 'Linux'
        run: |
          QXCB=$(find dist/AppDir/opt/WriterStudio -path '*/Qt/plugins/platforms/libqxcb.so' | head -n 1)
          QOFF=$(find dist/AppDir/opt/WriterStudio -path '*/Qt/plugins/platforms/libqoffscreen.so' | head -n 1)
          if [ -z "$QXCB" ] || [ -z "$QOFF" ]; then
            echo "ERROR: PyInstaller 没有收集 Qt 平台插件（libqxcb/libqoffscreen）" >&2
            echo "构建日志里若出现 'failed to obtain Qt library info'，说明构建机缺 Qt 系统库" >&2
            find dist/AppDir/opt/WriterStudio -maxdepth 3 -type d >&2
            exit 1
          fi
          if ldd "$QXCB" | grep 'not found'; then
            echo "ERROR: xcb 插件仍有未打包的依赖（干净系统上会加载失败）" >&2
            exit 1
          fi
      - name: Ad-hoc 签名（macOS 未经签名无法启动）
        if: runner.os == 'macOS'
        run: codesign --deep --force -s - dist/WriterStudio.app
      - name: Package (linux)
        if: runner.os == 'Linux'
        run: tar czf ${{ matrix.artifact }}.tar.gz -C dist WriterStudio
      - name: Package (macos)
        if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --keepParent WriterStudio.app ../${{ matrix.artifact }}.zip
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            WriterStudio-*.tar.gz
            WriterStudio-*.zip
            dist/*.AppImage
            dist/WriterStudio.exe
            dist/WriterStudioMCP.exe
          if-no-files-found: error

  smoke:
    # 干净容器里真的把 AppImage 跑起来。构建容器装了全套系统库，在那里测
    # “自带全部依赖”永远测不出漏打包；这里只有 ubuntu:22.04 本体。
    needs: build
    runs-on: ubuntu-latest
    container: "ubuntu:22.04"
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WriterStudio-linux64
      - name: 无桌面启动自检（Qt 平台插件 / 依赖是否真的在包里）
        run: |
          APP=$(find . -name 'WriterStudio-*.AppImage' | head -n 1)
          echo "Testing $APP"
          chmod +x "$APP"
          APPIMAGE_EXTRACT_AND_RUN=1 QT_QPA_PLATFORM=offscreen \
            timeout 120 "$APP" --self-check

  release:
    # 仅标签触发：汇总产物并发布 GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write          # 创建 Release 的唯一写权限点
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # 发布说明取自标签注释，需要完整标签对象
      - name: 版本核对（tag 与 pyproject 不一致仅提醒，不阻断）
        run: |
          PROJ_VER=$(python3 -c \
            "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG_VER="${GITHUB_REF_NAME#v}"
          if [ "$PROJ_VER" != "$TAG_VER" ]; then
            echo "::warning::pyproject.toml 版本 ($PROJ_VER) 与标签 ($TAG_VER) 不一致——发布前建议把 pyproject 版本一并更新"
          fi
      - name: 汇总产物
        uses: actions/download-artifact@v4
        with:
          path: relpkg
          merge-multiple: true
      - name: SHA256 校验和
        run: |
          cd relpkg
          # upload-artifact 会保留 dist/ 前缀（如 dist/*.AppImage），先扁平化
          find . -mindepth 2 -type f -exec mv -f {} . \;
          find . -mindepth 1 -type d -empty -delete
          ls -l
          sha256sum ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 发布说明 = 标签注释：只列更新项，不写解释性文字。
          # 标签没写注释时退回 GitHub 自动生成，避免空正文。
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > /tmp/relnotes.md
          if [ -s /tmp/relnotes.md ]; then
            gh release create "$GITHUB_REF_NAME" relpkg/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "WriterStudio $GITHUB_REF_NAME" \
              --notes-file /tmp/relnotes.md
          else
            gh release create "$GITHUB_REF_NAME" relpkg/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "WriterStudio $GITHUB_REF_NAME" \
              --generate-notes
          fi
