name: 准备测试环境
description: 安装 Linux Qt/TeX 系统依赖、配置指定版本 Python（含 pip 缓存）并安装项目、AI（MCP）及测试依赖

inputs:
  python-version:
    description: Python 版本号
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - name: Qt 运行时系统库 + TeX/poppler（与开发环境对齐，测试用到真实编译链）
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
          poppler-utils \
          texlive-latex-base texlive-latex-recommended \
          texlive-fonts-recommended texlive-pictures \
          texlive-xetex fonts-noto-cjk

    - name: 配置 Python ${{ inputs.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: 安装项目、AI（MCP）及测试依赖
      shell: bash
      run: python -m pip install ".[ai]" "pytest>=7.4"
